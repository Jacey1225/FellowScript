# CI: build+tag+push the backend image to GHCR — left half of docs/architecture/
# docker-plan.md's Phase 4 diagram (laptop -> GitHub -> GitHub Actions -> GHCR).
#
# Deliberately does NOT include the deploy-to-EC2 half (GHCR -> server pull ->
# container swap). That needs an SSH deploy key and the server-side
# ~/fellowscript-git/ checkout that docs/architecture/git-deploy-plan.md
# already planned but hasn't provisioned yet — adding it here would either be
# non-functional (no credentials to reach the server) or force a rushed
# credential-provisioning side effect. It's the natural next task once the
# deploy key exists.
#
# Deploy branch: defaulting to `main` (the repo's actual default branch —
# docs/architecture/git-deploy-plan.md line 87 flags this as assumed, not
# confirmed against a server-side deploy convention that doesn't exist yet;
# re-confirm if that changes).

name: Build and Push to GHCR

on:
  push:
    branches:
      - main

env:
  # Hardcoded lowercase, not templated off ${{ github.repository_owner }} /
  # ${{ github.repository }} — those resolve to the GitHub-cased "Jacey1225",
  # and GHCR/Docker repository paths must be all-lowercase or the push fails.
  IMAGE: ghcr.io/jacey1225/fellowscript-api

# Repo-default permissions are broader than this workflow needs. Least
# privilege for what actually happens below: read the checked-out source,
# write packages to GHCR (only in the build job, via its own override).
permissions:
  contents: read

jobs:
  # Real, blocking test gate — not decorative. api/db.py's create_tables()
  # is an idempotent (CREATE TABLE IF NOT EXISTS) schema bootstrap against
  # the same host="localhost"/dbname="fellowscript"/user="fellowscript" shape
  # every api/tests/test_*.py script already assumes (they boot the real
  # FastAPI app + DBManager, exactly as local dev does today). A Postgres
  # service container gives that same shape on the hosted runner, with a
  # password that only ever exists for this job.
  test:
    name: Run test suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fellowscript
          POSTGRES_DB: fellowscript
          # Ephemeral, workflow-scoped credential for a throwaway container
          # that's created and destroyed within this single job run — not a
          # secret worth provisioning as a repo/org secret, and never reused
          # anywhere else (matches the request's "no new credential" bar).
          POSTGRES_PASSWORD: ci-only-ephemeral-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U fellowscript"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_PASSWORD: ci-only-ephemeral-password
      # apple_service.py fails fast at import time if this is unset (no
      # implicit default, by design). CI is a non-production test run, same
      # as local dev's own .env, so "true" is the correct value here.
      APPLE_ALLOW_SANDBOX: "true"
      # api/tests/_pathfix.py-importing scripts set these themselves via
      # os.environ.setdefault(...), but api/main.py's module-level AWS/boto3
      # client construction runs before any test file gets a chance to do
      # that — set them here so the app boots the same way it does in local
      # dev without AWS credentials configured.
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy
      AWS_DEFAULT_REGION: us-east-1
      # test_sso_terms_gate.py's Google-auth test mocks a tokeninfo response
      # with aud=os.getenv("CLIENT_ID", ""). main.py's own audience check
      # (valid_auds.discard("")) deliberately treats an empty string as never
      # valid, so leaving this unset makes the mocked token unmatchable no
      # matter what -- not a real Google client ID, just needs to be the same
      # non-empty value on both sides of this same-process comparison.
      CLIENT_ID: ci-test-google-client-id
      # push.py's validate_apns_config() now fails fast at app boot (commit
      # 51c1d3f2) instead of silently degrading -- correct for prod, but it
      # means every test file that boots the real app via
      # TestClient(main_module.app) now needs *some* value here, same as
      # DB_PASSWORD/CLIENT_ID above. These are throwaway CI values; the file
      # at APPLE_KEY_PATH only needs to exist and be readable (validate_apns_
      # config() checks that, never parses its content at startup -- real
      # ES256-signing tests already carry their own fixture key).
      APPLE_KEY_ID: ci-test-apns-key-id
      APPLE_TEAM_ID: ci-test-apple-team-id
      APPLE_BUNDLE_ID: com.fellowscript.app
      APPLE_KEY_PATH: ${{ github.workspace }}/ci-dummy-apns-key.p8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Create dummy APNs key for CI boot
        # Not a real key -- validate_apns_config() only checks this file
        # exists and is readable at app-boot time (see the APPLE_KEY_PATH
        # comment above); it never parses key content outside the tests
        # that carry their own real fixture key.
        run: echo "-----BEGIN PRIVATE KEY-----" > "${{ env.APPLE_KEY_PATH }}"

      - name: Bootstrap schema
        working-directory: api
        # create_tables() only — deliberately not db.py's own main(), which
        # also TRUNCATEs and re-migrates data/*.json (real seed data files
        # committed to this repo) on every run. That's unnecessary and
        # wasteful for a throwaway CI database that only needs the schema
        # to exist so the test suite's inserts/reads have somewhere to go.
        #
        # Also creates the separate BACKUP_DB_NAME database + its schema
        # (db.py::create_backup_tables) — found missing when this workflow's
        # first real run hit a live code path (main.py::delete_user, exercised
        # by test_apple_jws_verification.py's own cleanup) that connects to it
        # directly. No CREATE DATABASE statement exists anywhere in this repo
        # for it (it was provisioned out-of-band on the real Postgres
        # instance), so CI has to do this step itself for a from-scratch
        # database — production's Postgres already has it and is unaffected.
        run: |
          python - <<'PY'
          import psycopg2
          from db import create_tables, create_backup_tables, BACKUP_DB_NAME, _connect

          conn = _connect()
          conn.autocommit = True  # CREATE DATABASE cannot run inside a transaction
          cur = conn.cursor()
          create_tables(cur)
          cur.execute(f"CREATE DATABASE {BACKUP_DB_NAME}")
          cur.close()
          conn.close()

          backup_conn = psycopg2.connect(
              host="localhost", port=5432,
              dbname=BACKUP_DB_NAME, user="fellowscript",
              password="ci-only-ephemeral-password",
          )
          backup_cur = backup_conn.cursor()
          create_backup_tables(backup_cur)
          backup_conn.commit()
          backup_cur.close()
          backup_conn.close()
          PY

      - name: Run test suite
        working-directory: api
        # Each tests/test_*.py already runs as a real, standalone smoke test
        # (`python tests/test_x.py`) and exits non-zero on failure — this
        # loop runs every one and fails the job if any of them do.
        #
        # tests/test_cancel_reflect.py and tests/test_expiry_reflect.py used
        # to print a pass/fail line without ever calling sys.exit()/raising
        # on failure, so a broken assertion inside either couldn't flip this
        # loop's exit code (compile-errors #8, compliance sweep
        # 20260830-fellowscript-full-sweep). Both now sys.exit(1) on failure,
        # matching every other file in tests/test_*.py.
        run: |
          set -uo pipefail
          failed=0
          for f in tests/test_*.py; do
            echo "::group::${f}"
            python "${f}"
            status=$?
            if [ "${status}" -ne 0 ]; then
              echo "FAILED: ${f} (exit ${status})"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "${failed}"

  # Drift check for task 20260824-web-notes-stale-bundle: frontend/dist is a
  # committed, manually-built static artifact (no frontend deploy pipeline
  # exists yet -- docs/architecture/git-deploy-plan.md explicitly scoped
  # rsync-to-EC2 deploy out of that plan). It silently drifted a full day
  # behind frontend/src after 8710a27a changed the notes GET response shape,
  # shipping a pre-pagination UI to production that showed users none of
  # their notes. `npm run build` (vite) produces content-hashed filenames, so
  # a clean checkout's committed dist/ must be byte-identical to what
  # building frontend/src right now produces -- any diff means src changed
  # without dist being rebuilt and recommitted. Deliberately scoped as a
  # freshness *check* only, not a frontend build/deploy pipeline (that stays
  # the existing manual `npm run build && rsync` step).
  frontend-dist-freshness:
    name: Check frontend/dist matches a fresh build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Fail if committed frontend/dist drifted from a fresh build
        run: |
          if ! git diff --quiet -- frontend/dist; then
            echo "::error::frontend/dist does not match a fresh 'npm run build' of frontend/src -- rebuild it locally (cd frontend && npm run build) and commit the result."
            git status --porcelain -- frontend/dist
            git diff --stat -- frontend/dist
            exit 1
          fi

  build-and-push:
    name: Build, tag, and push to GHCR
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Built-in, automatically-scoped-to-this-repo token — no PAT or
          # other credential provisioned for this workflow.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Repo root as build context, root Dockerfile — matches
          # docker-compose.yml's `context: .` / `dockerfile: Dockerfile` so
          # the image this produces is the same shape as the one built
          # locally/on the deploy host.
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
