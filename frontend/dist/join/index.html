<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <!-- The invite token is in this page's URL: never send it as a Referer. -->
  <meta name="referrer" content="no-referrer" />
  <meta name="color-scheme" content="dark" />
  <title>You've been invited — FellowScript</title>
  <style>
    :root { --ink: #17120f; --cream: #f6efe6; --gold: #ffc61a; --gold-dim: #c8861a; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem;
      background: radial-gradient(ellipse at 20% 10%, rgba(255,198,26,0.18), transparent 55%),
                  radial-gradient(ellipse at 85% 90%, rgba(200,134,26,0.16), transparent 50%), var(--ink);
      color: var(--cream); font-family: -apple-system, system-ui, 'Inter', sans-serif; text-align: center;
    }
    main { width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; gap: 1rem; }
    .wordmark { font-family: 'Playfair Display', Georgia, serif; font-size: 1.6rem; font-weight: 700; margin: 0; }
    .wordmark em { color: var(--gold); }
    h1 { margin: 0.5rem 0 0; font-family: 'Playfair Display', Georgia, serif; font-size: 1.5rem; outline: none; }
    p { margin: 0; font-size: 0.9rem; line-height: 1.6; color: rgba(246,239,230,0.75); }
    .pill, .ghost { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 1.4rem; border-radius: 999px; text-decoration: none; font-weight: 600; }
    .pill { width: 100%; color: var(--ink); background: linear-gradient(135deg, #ffdf6b, var(--gold) 60%, var(--gold-dim)); }
    .ghost { color: var(--gold); border: 1px solid rgba(255,198,26,0.4); }
    .pill:focus-visible, .ghost:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    [hidden] { display: none !important; }
  </style>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18485511191"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'AW-18485511191');
    </script>

</head>
<body>
  <main>
    <p class="wordmark">Fellow<em>Script</em></p>

    <section id="valid" hidden>
      <h1 id="valid-heading" tabindex="-1">You've been invited to a group</h1>
    </section>
    <section id="invalid" hidden>
      <h1 id="invalid-heading" tabindex="-1">This invite link isn't valid</h1>
    </section>

    <a id="continue" class="pill" href="/" hidden>Continue in browser</a>
    <a id="appstore" class="ghost" href="https://apps.apple.com/us/app/fellowscript-study-connect/id6791701454" hidden>Get the app</a>
    <p id="helper" hidden>Already have the app? Open this link on your iPhone.</p>
    <a id="home" class="pill" href="/" hidden>Go to FellowScript</a>
  </main>

  <script>
    // The only thing done with the URL: match a strictly validated token and
    // build a fixed same-origin "/#/join/<token>" href. Nothing from the URL
    // is ever used as a redirect target or inserted as HTML.
    (function () {
      var m = /^\/join\/([A-Za-z0-9_-]{43})\/?$/.exec(window.location.pathname);
      var show = function (id) { document.getElementById(id).hidden = false; };
      if (m) {
        document.getElementById('continue').setAttribute('href', '/#/join/' + m[1]);
        show('valid'); show('continue'); show('appstore'); show('helper');
        document.getElementById('valid-heading').focus();
      } else {
        show('invalid'); show('home');
        document.getElementById('invalid-heading').focus();
      }
    })();
  </script>
</body>
</html>
