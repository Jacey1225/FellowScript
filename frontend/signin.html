<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Deployment-specific value (Configuration Q2) -- the one canonical
       override point for this no-build page's API base URL; js/config.js
       falls back to its own bundled default when this is absent. -->
  <meta name="api-base" content="https://fellowscript.com/api" />
  <title>FellowScript — Sign In</title>
  <link rel="icon" type="image/svg+xml" href="tab_logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Lora:ital,wght@0,400;0,600;1,400&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/signin.css" />
</head>
<body>

  <video id="bg-video" autoplay muted loop playsinline>
    <source src="../data/bg.mp4" type="video/mp4" />
  </video>

  <nav class="main-nav">
    <a class="nav-logo" href="index.html">
      <span class="fellow">Fellow</span><span class="script">Script</span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="reader.html">Read</a></li>
      <li><a href="signin.html" class="active">Sign In</a></li>
    </ul>
    <button class="hamburger" id="hamburger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <div class="mobile-nav-drawer" id="mobile-nav-drawer">
    <a href="index.html">Home</a>
    <a href="reader.html">Read</a>
    <a href="signin.html" class="active">Sign In</a>
  </div>

  <main>
    <div class="auth-card">

      <div class="card-logo">
        <span class="fellow">Fellow</span><span class="script">Script</span>
      </div>
      <div class="card-divider"></div>

      <!-- Tab toggle -->
      <div class="tab-row">
        <button class="tab active" id="tab-signin" onclick="showTab('signin')">Sign In</button>
        <button class="tab"        id="tab-signup" onclick="showTab('signup')">Create Account</button>
      </div>

      <!-- Sign In form -->
      <form class="auth-form visible" id="form-signin" onsubmit="handleSignin(event)">
        <div class="field">
          <label for="si-username">Username</label>
          <input id="si-username" type="text" placeholder="yourname" required />
        </div>
        <div class="field">
          <label for="si-pass">Password</label>
          <input id="si-pass" type="password" placeholder="••••••••" required />
        </div>
        <div class="msg" id="si-msg"></div>
        <button class="submit-btn" type="submit" id="si-btn">Sign In</button>
      </form>

      <!-- Sign Up form -->
      <form class="auth-form" id="form-signup" onsubmit="handleSignup(event)">
        <div class="field">
          <label for="su-username">Username</label>
          <input id="su-username" type="text" placeholder="yourname" required />
        </div>
        <div class="field">
          <label for="su-email">Email</label>
          <input id="su-email" type="email" placeholder="you@example.com" required />
        </div>
        <div class="field">
          <label for="su-pass">Password</label>
          <input id="su-pass" type="password" placeholder="••••••••" required />
        </div>
        <div class="msg" id="su-msg"></div>
        <button class="submit-btn" type="submit" id="su-btn">Create Account</button>
      </form>

    </div>
  </main>

  <footer>&copy; 2026 FellowScript &nbsp;·&nbsp; A Digital Scripture Community</footer>

  <script>
    const API = 'https://fellowscript.com/api';

    // ── Tab toggle ────────────────────────────────────────────────────────────

    function showTab(tab) {
      document.getElementById('tab-signin').classList.toggle('active', tab === 'signin');
      document.getElementById('tab-signup').classList.toggle('active', tab === 'signup');
      document.getElementById('form-signin').classList.toggle('visible', tab === 'signin');
      document.getElementById('form-signup').classList.toggle('visible', tab === 'signup');
      clearMessages();
    }

    function clearMessages() {
      ['si-msg', 'su-msg'].forEach(id => {
        const el = document.getElementById(id);
        el.className = 'msg';
        el.textContent = '';
      });
    }

    function showMsg(id, text, type) {
      const el = document.getElementById(id);
      el.textContent = text;
      el.className = `msg ${type}`;
    }

    function setLoading(btnId, loading) {
      const btn = document.getElementById(btnId);
      btn.disabled = loading;
      btn.textContent = loading ? 'Please wait…' : btn.dataset.label;
    }

    // Store labels for reset
    document.getElementById('si-btn').dataset.label = 'Sign In';
    document.getElementById('su-btn').dataset.label = 'Create Account';

    // ── Sign In ───────────────────────────────────────────────────────────────

    async function handleSignin(e) {
      e.preventDefault();
      clearMessages();
      setLoading('si-btn', true);

      const body = {
        username:   document.getElementById('si-username').value.trim(),
        plain_pass: document.getElementById('si-pass').value,
      };

      try {
        const res = await fetch(`${API}/login`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify(body),
        });

        const data = await res.json();

        if (!res.ok) {
          showMsg('si-msg', data.detail || 'Sign in failed.', 'error');
          return;
        }

        sessionStorage.setItem('user', JSON.stringify(data));
        localStorage.setItem('fs_user', JSON.stringify(data));
        window.location.href = 'reader.html';
      } catch {
        showMsg('si-msg', 'Could not reach the server. Is the API running?', 'error');
      } finally {
        setLoading('si-btn', false);
      }
    }

    // ── Sign Up ───────────────────────────────────────────────────────────────

    async function handleSignup(e) {
      e.preventDefault();
      clearMessages();
      setLoading('su-btn', true);

      const body = {
        username:   document.getElementById('su-username').value.trim(),
        email:      document.getElementById('su-email').value.trim(),
        plain_pass: document.getElementById('su-pass').value,
      };

      try {
        const res = await fetch(`${API}/signup`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify(body),
        });

        const data = await res.json();

        if (!res.ok) {
          showMsg('su-msg', data.detail || 'Sign up failed.', 'error');
          return;
        }

        sessionStorage.setItem('user', JSON.stringify(data));
        localStorage.setItem('fs_user', JSON.stringify(data));
        localStorage.setItem('fs_tour', 'reader'); // start onboarding tour for new users
        window.location.href = 'reader.html';
      } catch {
        showMsg('su-msg', 'Could not reach the server. Is the API running?', 'error');
      } finally {
        setLoading('su-btn', false);
      }
    }

    // ── Hamburger ──────────────────────────────────────────────────────────────
    (function() {
      const hamburger = document.getElementById('hamburger');
      const drawer    = document.getElementById('mobile-nav-drawer');
      if (!hamburger || !drawer) return;
      hamburger.addEventListener('click', () => {
        const open = hamburger.classList.toggle('open');
        drawer.classList.toggle('open', open);
      });
      document.addEventListener('click', e => {
        if (!hamburger.contains(e.target) && !drawer.contains(e.target)) {
          hamburger.classList.remove('open');
          drawer.classList.remove('open');
        }
      });
    })();
  </script>
</body>
</html>
