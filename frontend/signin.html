<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FellowScript — Sign In</title>
  <link rel="icon" type="image/svg+xml" href="../data/tab_logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Lora:ital,wght@0,400;0,600;1,400&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold:       #C8861A;
      --gold-light: #E8A83A;
      --gold-dim:   #8A5C0E;
      --ink:        #1A100A;
      --parchment:  #F4E4C1;
      --nav-h:      68px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Lora', Georgia, serif;
      background: #0a0703;
      color: var(--parchment);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #bg-video {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: -2;
      filter: brightness(0.3) sepia(0.4);
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 256px;
      pointer-events: none;
      opacity: 0.6;
    }

    /* ── Nav ── */
    .main-nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      height: var(--nav-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 3rem;
      background: linear-gradient(to bottom, rgba(10,7,3,0.92) 0%, rgba(10,7,3,0.78) 100%);
      backdrop-filter: blur(4px);
      border-bottom: 1px solid rgba(200,134,26,0.12);
    }

    .nav-logo {
      display: flex;
      align-items: baseline;
      text-decoration: none;
      line-height: 1;
    }

    .nav-logo .fellow {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: #c8c0b8;
      letter-spacing: -0.01em;
    }

    .nav-logo .script {
      font-family: 'IM Fell English', serif;
      font-size: 1.6rem;
      font-style: italic;
      color: var(--gold);
    }

    .nav-links {
      display: flex;
      gap: 2.5rem;
      list-style: none;
    }

    .nav-links a {
      font-family: 'Lora', serif;
      font-size: 0.8rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(244,228,193,0.7);
      text-decoration: none;
      transition: color 0.3s;
    }

    .nav-links a:hover,
    .nav-links a.active { color: var(--gold); }

    .hamburger {
      display: none;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      width: 38px; height: 38px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      z-index: 110;
    }
    .hamburger span {
      display: block;
      width: 100%; height: 2px;
      background: var(--gold);
      border-radius: 2px;
      transition: transform 0.25s, opacity 0.25s;
      transform-origin: center;
    }
    .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
    .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    .mobile-nav-drawer {
      display: none;
      position: fixed;
      top: var(--nav-h);
      left: 0; right: 0;
      z-index: 98;
      background: rgba(8,5,2,0.97);
      border-bottom: 1px solid rgba(200,134,26,0.2);
      backdrop-filter: blur(12px);
      padding: 0.8rem 0;
      transform: translateY(-100%);
      transition: transform 0.28s ease;
    }
    .mobile-nav-drawer.open { transform: translateY(0); }
    .mobile-nav-drawer a {
      display: block;
      padding: 0.85rem 2rem;
      font-family: 'Lora', serif;
      font-size: 0.82rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(244,228,193,0.75);
      text-decoration: none;
      border-bottom: 1px solid rgba(200,134,26,0.08);
      transition: color 0.2s, background 0.2s;
    }
    .mobile-nav-drawer a:last-child { border-bottom: none; }
    .mobile-nav-drawer a:hover,
    .mobile-nav-drawer a.active { color: var(--gold); background: rgba(200,134,26,0.06); }

    /* ── Page layout ── */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(var(--nav-h) + 3rem) 1.5rem 4rem;
    }

    /* ── Auth card ── */
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: rgba(8, 5, 2, 0.88);
      border: 1px solid rgba(200,134,26,0.2);
      backdrop-filter: blur(14px);
      padding: 3.2rem 3.2rem 2.8rem;
      animation: fadeUp 0.5s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-logo {
      text-align: center;
      margin-bottom: 2rem;
    }

    .card-logo .fellow {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: #c8c0b8;
    }

    .card-logo .script {
      font-family: 'IM Fell English', serif;
      font-size: 1.5rem;
      font-style: italic;
      color: var(--gold);
    }

    .card-divider {
      width: 40px;
      height: 1px;
      background: rgba(200,134,26,0.3);
      margin: 0 auto 1.8rem;
    }

    /* ── Tab toggle ── */
    .tab-row {
      display: flex;
      margin-bottom: 2rem;
      border-bottom: 1px solid rgba(200,134,26,0.18);
    }

    .tab {
      flex: 1;
      background: none;
      border: none;
      padding: 0.65rem 0;
      font-family: 'Lora', serif;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(244,228,193,0.35);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color 0.2s, border-color 0.2s;
    }

    .tab.active {
      color: var(--gold);
      border-bottom-color: var(--gold);
    }

    /* ── Forms ── */
    .auth-form { display: none; flex-direction: column; gap: 1.2rem; }
    .auth-form.visible { display: flex; }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .field label {
      font-size: 0.65rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(200,134,26,0.65);
    }

    .field input {
      background: rgba(20,12,4,0.6);
      border: 1px solid rgba(200,134,26,0.25);
      border-radius: 2px;
      color: var(--parchment);
      font-family: 'Lora', serif;
      font-size: 0.92rem;
      padding: 0.65rem 0.9rem;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
    }

    .field input:focus { border-color: var(--gold); }

    .field input::placeholder { color: rgba(244,228,193,0.2); }

    /* ── Submit button ── */
    .submit-btn {
      margin-top: 0.4rem;
      padding: 0.9rem;
      background: var(--gold);
      color: var(--ink);
      border: none;
      font-family: 'Lora', serif;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.25s, transform 0.15s;
      width: 100%;
    }

    .submit-btn:hover { background: var(--gold-light); transform: translateY(-1px); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* ── Feedback message ── */
    .msg {
      font-size: 0.78rem;
      letter-spacing: 0.05em;
      line-height: 1.55;
      padding: 0.7rem 0.9rem;
      border-radius: 2px;
      display: none;
    }

    .msg.error {
      display: block;
      background: rgba(180,50,50,0.15);
      border: 1px solid rgba(180,50,50,0.35);
      color: #e89090;
    }

    .msg.success {
      display: block;
      background: rgba(60,160,80,0.12);
      border: 1px solid rgba(60,160,80,0.3);
      color: #90d4a0;
    }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 2rem;
      border-top: 1px solid rgba(200,134,26,0.1);
      color: rgba(244,228,193,0.25);
      font-size: 0.68rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    /* ── Mobile ── */
    @media (max-width: 480px) {
      .main-nav { padding: 0 1.5rem; }
      .nav-links { display: none; }
      .hamburger { display: flex; }
      .mobile-nav-drawer { display: block; }
      .auth-card { padding: 2.4rem 1.6rem 2rem; }
    }
  </style>
</head>
<body>

  <video id="bg-video" autoplay muted loop playsinline>
    <source src="../data/bg.mp4" type="video/mp4" />
  </video>

  <nav class="main-nav">
    <a class="nav-logo" href="index.html">
      <span class="fellow">Fellow</span><span class="script">Script</span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="reader.html">Read</a></li>
      <li><a href="signin.html" class="active">Sign In</a></li>
    </ul>
    <button class="hamburger" id="hamburger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <div class="mobile-nav-drawer" id="mobile-nav-drawer">
    <a href="index.html">Home</a>
    <a href="reader.html">Read</a>
    <a href="signin.html" class="active">Sign In</a>
  </div>

  <main>
    <div class="auth-card">

      <div class="card-logo">
        <span class="fellow">Fellow</span><span class="script">Script</span>
      </div>
      <div class="card-divider"></div>

      <!-- Tab toggle -->
      <div class="tab-row">
        <button class="tab active" id="tab-signin" onclick="showTab('signin')">Sign In</button>
        <button class="tab"        id="tab-signup" onclick="showTab('signup')">Create Account</button>
      </div>

      <!-- Sign In form -->
      <form class="auth-form visible" id="form-signin" onsubmit="handleSignin(event)">
        <div class="field">
          <label for="si-username">Username</label>
          <input id="si-username" type="text" placeholder="yourname" required />
        </div>
        <div class="field">
          <label for="si-pass">Password</label>
          <input id="si-pass" type="password" placeholder="••••••••" required />
        </div>
        <div class="msg" id="si-msg"></div>
        <button class="submit-btn" type="submit" id="si-btn">Sign In</button>
      </form>

      <!-- Sign Up form -->
      <form class="auth-form" id="form-signup" onsubmit="handleSignup(event)">
        <div class="field">
          <label for="su-username">Username</label>
          <input id="su-username" type="text" placeholder="yourname" required />
        </div>
        <div class="field">
          <label for="su-email">Email</label>
          <input id="su-email" type="email" placeholder="you@example.com" required />
        </div>
        <div class="field">
          <label for="su-pass">Password</label>
          <input id="su-pass" type="password" placeholder="••••••••" required />
        </div>
        <div class="msg" id="su-msg"></div>
        <button class="submit-btn" type="submit" id="su-btn">Create Account</button>
      </form>

    </div>
  </main>

  <footer>&copy; 2026 FellowScript &nbsp;·&nbsp; A Digital Scripture Community</footer>

  <script>
    const API = 'https://fellowscript.com/api';

    // ── Tab toggle ────────────────────────────────────────────────────────────

    function showTab(tab) {
      document.getElementById('tab-signin').classList.toggle('active', tab === 'signin');
      document.getElementById('tab-signup').classList.toggle('active', tab === 'signup');
      document.getElementById('form-signin').classList.toggle('visible', tab === 'signin');
      document.getElementById('form-signup').classList.toggle('visible', tab === 'signup');
      clearMessages();
    }

    function clearMessages() {
      ['si-msg', 'su-msg'].forEach(id => {
        const el = document.getElementById(id);
        el.className = 'msg';
        el.textContent = '';
      });
    }

    function showMsg(id, text, type) {
      const el = document.getElementById(id);
      el.textContent = text;
      el.className = `msg ${type}`;
    }

    function setLoading(btnId, loading) {
      const btn = document.getElementById(btnId);
      btn.disabled = loading;
      btn.textContent = loading ? 'Please wait…' : btn.dataset.label;
    }

    // Store labels for reset
    document.getElementById('si-btn').dataset.label = 'Sign In';
    document.getElementById('su-btn').dataset.label = 'Create Account';

    // ── Sign In ───────────────────────────────────────────────────────────────

    async function handleSignin(e) {
      e.preventDefault();
      clearMessages();
      setLoading('si-btn', true);

      const body = {
        username:   document.getElementById('si-username').value.trim(),
        plain_pass: document.getElementById('si-pass').value,
      };

      try {
        const res = await fetch(`${API}/login`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify(body),
        });

        const data = await res.json();

        if (!res.ok) {
          showMsg('si-msg', data.detail || 'Sign in failed.', 'error');
          return;
        }

        sessionStorage.setItem('user', JSON.stringify(data));
        window.location.href = 'reader.html';
      } catch {
        showMsg('si-msg', 'Could not reach the server. Is the API running?', 'error');
      } finally {
        setLoading('si-btn', false);
      }
    }

    // ── Sign Up ───────────────────────────────────────────────────────────────

    async function handleSignup(e) {
      e.preventDefault();
      clearMessages();
      setLoading('su-btn', true);

      const body = {
        username:   document.getElementById('su-username').value.trim(),
        email:      document.getElementById('su-email').value.trim(),
        plain_pass: document.getElementById('su-pass').value,
      };

      try {
        const res = await fetch(`${API}/signup`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify(body),
        });

        const data = await res.json();

        if (!res.ok) {
          showMsg('su-msg', data.detail || 'Sign up failed.', 'error');
          return;
        }

        sessionStorage.setItem('user', JSON.stringify(data));
        window.location.href = 'reader.html';
      } catch {
        showMsg('su-msg', 'Could not reach the server. Is the API running?', 'error');
      } finally {
        setLoading('su-btn', false);
      }
    }

    // ── Hamburger ──────────────────────────────────────────────────────────────
    (function() {
      const hamburger = document.getElementById('hamburger');
      const drawer    = document.getElementById('mobile-nav-drawer');
      if (!hamburger || !drawer) return;
      hamburger.addEventListener('click', () => {
        const open = hamburger.classList.toggle('open');
        drawer.classList.toggle('open', open);
      });
      document.addEventListener('click', e => {
        if (!hamburger.contains(e.target) && !drawer.contains(e.target)) {
          hamburger.classList.remove('open');
          drawer.classList.remove('open');
        }
      });
    })();
  </script>
</body>
</html>
