# Task 20260930-downloads-page-indexable: nginx addition for the indexable
# downloads page. PREPARED IN THE REPO ONLY -- NOT applied to the server.
# Applying it changes server behaviour and needs explicit user confirmation.
#
# Only needed if the server's catch-all is `try_files $uri /index.html;`
# (which would serve Home for /download/). If the catch-all already includes
# `$uri/` (i.e. `try_files $uri $uri/ /index.html;`), nginx serves
# /var/www/html/download/index.html for /download/ and 301s /download to
# /download/ on its own, and this snippet can be skipped. Verify first with:
#   curl -sI https://fellowscript.com/download/ ; curl -s https://fellowscript.com/download/ | grep -o '<title>[^<]*'
#
# Include inside the existing `server { ... }` block for fellowscript.com, ahead
# of the catch-all location, then `sudo nginx -t && sudo systemctl reload nginx`.

# Canonical form is the trailing-slash URL (matches the sitemap and canonical
# tag). Redirect the bare path to it. Exact match, so /download-anything is
# untouched.
location = /download {
    return 301 /download/;
}

# Serve only the prerendered page. No proxying, no directory listing, and no
# other file is reachable under this prefix. Indexable, so no X-Robots-Tag.
location = /download/ {
    default_type text/html;
    add_header Cache-Control "public, max-age=300";
    try_files /download/index.html =404;
}
