# Task 20261008-explore-page-indexable: nginx addition for the indexable
# Explore landing page. PREPARED IN THE REPO ONLY -- NOT applied to the server.
# Applying it changes server behaviour and needs explicit user confirmation.
#
# Only needed if the server's catch-all is `try_files $uri /index.html;`
# (which would serve Home for /explore/). If the catch-all already includes
# `$uri/` (i.e. `try_files $uri $uri/ /index.html;`), nginx serves
# /var/www/html/explore/index.html for /explore/ on its own, and this snippet
# can be skipped. Verify first with:
#   curl -sI https://fellowscript.com/explore/ ; curl -s https://fellowscript.com/explore/ | grep -o '<title>[^<]*'
#
# The prerendered file is "index, follow" only if it was built with
# VITE_EXPLORER_BROWSE on; otherwise it is "noindex, nofollow". Rebuild and
# redeploy when the server-side browse flag flips.
#
# Include inside the existing `server { ... }` block for fellowscript.com, ahead
# of the catch-all location, then `sudo nginx -t && sudo systemctl reload nginx`.

# Canonical form is the trailing-slash URL (matches the sitemap and canonical
# tag). Exact match, so /explore-anything is untouched.
location = /explore {
    return 301 /explore/;
}

# Serve only the prerendered landing page. Exact match: /explore/manage,
# /explore/requests and any other /explore/<x> are NOT served this file (they
# fall through to the existing catch-all, and robots.txt keeps them disallowed).
# No proxying, no directory listing.
location = /explore/ {
    default_type text/html;
    add_header Cache-Control "public, max-age=300";
    try_files /explore/index.html =404;
}
