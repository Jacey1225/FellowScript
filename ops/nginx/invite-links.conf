# Task 20260929-group-invite-links: nginx additions for invite links.
# PREPARED IN THE REPO ONLY -- NOT applied to the server. Applying this
# changes network exposure and needs explicit user confirmation (see the
# task's ship notes). Include inside the existing `server { ... }` block for
# fellowscript.com, ahead of the catch-all location, then
# `sudo nginx -t && sudo systemctl reload nginx`.

# Apple app-site-association: exact path, 200, application/json, no redirect
# (Apple's CDN does not follow redirects), no file extension.
location = /.well-known/apple-app-site-association {
    default_type application/json;
    add_header Cache-Control "public, max-age=3600";
    try_files /.well-known/apple-app-site-association =404;
}

# Static invite landing page. The token stays in the URL only; the page
# validates it client-side and links to the fixed /#/join/<token> route.
# Never serve or proxy anything else from this prefix.
location ^~ /join/ {
    default_type text/html;
    add_header Cache-Control "no-store";
    add_header Referrer-Policy "no-referrer";
    add_header X-Robots-Tag "noindex, nofollow";
    try_files /join/index.html =404;
}
