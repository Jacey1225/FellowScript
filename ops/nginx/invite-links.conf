# Task 20260929-group-invite-links: nginx additions for invite links.
# PREPARED IN THE REPO ONLY -- NOT applied to the server. Applying this
# changes network exposure and needs explicit user confirmation (see the
# task's ship notes). Include inside the existing `server { ... }` block for
# fellowscript.com, ahead of the catch-all location, then
# `sudo nginx -t && sudo systemctl reload nginx`.

# Apple app-site-association: exact path, 200, application/json, no redirect
# (Apple's CDN does not follow redirects), no file extension.
location = /.well-known/apple-app-site-association {
    default_type application/json;
    add_header Cache-Control "public, max-age=3600";
    try_files /.well-known/apple-app-site-association =404;
}

# Static invite landing page. The token stays in the URL only; the page
# validates it client-side and links to the fixed /#/join/<token> route.
# Never serve or proxy anything else from this prefix.
location ^~ /join/ {
    default_type text/html;
    add_header Cache-Control "no-store";
    add_header Referrer-Policy "no-referrer";
    add_header X-Robots-Tag "noindex, nofollow";
    try_files /join/index.html =404;
}

# Task 20261011-ios-share-notes-highlights: friend-request (/u/<username>) and
# verse (/v/<book>/<chapter>/<verse>) share links. Same posture as /join/:
# PREPARED IN THE REPO ONLY, NOT applied. Applying changes network exposure and
# needs explicit user confirmation. Each page validates its own path
# client-side against a strict allowlist and never reflects the URL into the
# DOM. Only these two fixed files are served; nothing is proxied.
location ^~ /u/ {
    default_type text/html;
    add_header Cache-Control "no-store";
    add_header Referrer-Policy "no-referrer";
    add_header X-Robots-Tag "noindex, nofollow";
    try_files /u/index.html =404;
}

location ^~ /v/ {
    default_type text/html;
    add_header Cache-Control "no-store";
    add_header Referrer-Policy "no-referrer";
    add_header X-Robots-Tag "noindex, nofollow";
    try_files /v/index.html =404;
}

# Group request-to-join link (/g/<public_id>), same posture as /u/ and /v/:
# PREPARED IN THE REPO ONLY, NOT applied; needs explicit user confirmation.
# The page is static, makes no API calls, and never renders the id.
location ^~ /g/ {
    default_type text/html;
    add_header Cache-Control "no-store";
    add_header Referrer-Policy "no-referrer";
    add_header X-Robots-Tag "noindex, nofollow";
    try_files /g/index.html =404;
}
