# Prepared by shared-foundation step 5 (contract-v2 section 6.1, action A4).
# NOT APPLIED by any gate: Jacey applies it by hand on the nginx host.
#
# Goal: nginx, not the client, decides what the API sees in CF-Connecting-IP,
# so a client that reaches the origin directly cannot choose its rate-limit
# bucket. The API trusts that header only from a loopback peer
# (api/backend/rate_limiting.py) and runs uvicorn with --no-proxy-headers.
#
# 1. In the http {} or server {} block: one set_real_ip_from line per
#    Cloudflare range. Copy the CURRENT lists at apply time from
#    https://www.cloudflare.com/ips-v4 and https://www.cloudflare.com/ips-v6
#    (they change; do not paste a stale list from this file).
# set_real_ip_from <each range from ips-v4>;
# set_real_ip_from <each range from ips-v6>;
real_ip_header CF-Connecting-IP;

# 2. In the EXISTING location that proxy_passes to the API, add the line below.
#    proxy_set_header directives are inherited only when a location defines
#    none of its own, so re-declare the ones already present there (Host,
#    X-Forwarded-For, X-Forwarded-Proto, Upgrade/Connection for /ws).
#
#    proxy_set_header CF-Connecting-IP $remote_addr;
#
# Effect: for a request arriving from a Cloudflare range, $remote_addr becomes
# the genuine visitor IP; for any other source it stays the socket address.
# Either way nginx overwrites the header.
#
# After applying: `sudo nginx -t && sudo systemctl reload nginx`, then
# verify with curl --resolve fellowscript.com:443:<origin-ip> sending two
# different spoofed CF-Connecting-IP values, 12 /login attempts each: both
# must collapse to one bucket and the 11th attempt must return 429.
